# Project distribution implementation.

name: Distribution source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
      - name: Audit source distribution
        run: python3 tools/audit-release.py --distribution --allow-git
